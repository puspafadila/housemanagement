const pad2 = (n) => String(n).padStart(2, "0");
const toLocalISO = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

const todayISO = () => toLocalISO(new Date());

const fmtDate = (iso) => {
  if (!iso) return "-";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
};

const daysUntil = (iso) => {
  if (!iso) return null;
  const d = new Date(iso + "T00:00:00");
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return Math.round((d - t) / 86400000);
};

const datesInRange = (start, end) => {
  if (!start || !end) return [];
  const out = [];
  let cur = new Date(start + "T00:00:00");
  const last = new Date(end + "T00:00:00");
  if (isNaN(cur) || isNaN(last) || cur > last) return [];
  while (cur <= last) {
    out.push(toLocalISO(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return out;
};

   Financial helpers — savings goals & long-term projections
--------------------------------------------------------- */
const goalSaved = (goal) => (goal.contributions || []).reduce((a, c) => a + (Number(c.amount) || 0), 0);

// simple average-pace estimate of when a goal will be reached
const goalEstimate = (goal) => {
  const contributions = goal.contributions || [];
  if (!contributions.length) return null;
  const dates = contributions.map((c) => c.date).filter(Boolean).sort();
  const first = dates[0];
  const monthsElapsed = Math.max(1, Math.round((new Date() - new Date(first + "T00:00:00")) / (30.4375 * 86400000)));
  const saved = goalSaved(goal);
  const avgMonthly = saved / monthsElapsed;
  const remaining = (Number(goal.target) || 0) - saved;
  if (avgMonthly <= 0 || remaining <= 0) return { avgMonthly, monthsToGo: null };
  const monthsToGo = Math.ceil(remaining / avgMonthly);
  return { avgMonthly, monthsToGo };
};

// Three-way merge so two users saving at different times don't wipe each
// other out: base = what this browser last loaded/saved, local = its edits,
// remote = what's in Supabase now. Local edits win only where local != base.
const isIdArray = (v) => Array.isArray(v) && v.length > 0 && v.every((x) => x && typeof x === "object" && !Array.isArray(x) && x.id !== undefined);
const sameJSON = (x, y) => JSON.stringify(x) === JSON.stringify(y);
const mergeThreeWay = (base, local, remote) => {
  if (sameJSON(local, base)) return remote === undefined ? local : remote;
  if (sameJSON(remote, base) || remote === undefined) return local;
  const arrLike = (v) => Array.isArray(v) && (v.length === 0 || isIdArray(v));
  if (arrLike(local) && arrLike(remote) && (base === undefined || arrLike(base))) {
    const b = base || [];
    const bm = new Map(b.map((x) => [x.id, x]));
    const lm = new Map(local.map((x) => [x.id, x]));
    const rm = new Map(remote.map((x) => [x.id, x]));
    const out = [];
    const seen = new Set();
    const order = [...remote.map((x) => x.id), ...local.map((x) => x.id)];
    order.forEach((id) => {
      if (seen.has(id)) return;
      seen.add(id);
      const inB = bm.has(id), inL = lm.has(id), inR = rm.has(id);
      if (inL && inR) out.push(inB ? mergeThreeWay(bm.get(id), lm.get(id), rm.get(id)) : lm.get(id));
      else if (inL && !inR) { if (!inB) out.push(lm.get(id)); /* else: removed remotely */ }
      else if (!inL && inR) { if (!inB) out.push(rm.get(id)); /* else: removed locally */ }
    });
    return out;
  }
  const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
  if (isObj(local) && isObj(remote)) {
    const bb = isObj(base) ? base : {};
    const out = {};
    new Set([...Object.keys(remote), ...Object.keys(local)]).forEach((k) => {
      if (!(k in local)) { if (!(k in bb)) out[k] = remote[k]; return; }
      if (!(k in remote)) { if (!(k in bb)) out[k] = local[k]; return; }
      out[k] = mergeThreeWay(bb[k], local[k], remote[k]);
    });
    return out;
  }
  return local;
};

// Reusable per-page Save button. Every page that lets the user edit data
// should render this near the top of its panel — it always saves the
// whole app's data (there's one underlying store), it just gives each
// page its own explicit trigger instead of a single global one. No status
// text here by design — unsaved changes are surfaced via the leave-warning
// popup instead, not a persistent label.
function PageSaveBar({ dirty, saving, error, onSave }) {
  return (
    <div className="save-bar">
      {error && <span className="save-status dirty">Gagal menyimpan, coba lagi</span>}
      <button type="button" className="btn-primary" onClick={onSave} disabled={saving || !dirty} style={{ marginLeft: "auto" }}>
        {saving ? <Loader2 size={16} className="spin" /> : <Check size={16} />} Save
      </button>
    </div>
  );
}

const sortGoalsByPriority = (goals) =>
  [...goals].sort((a, b) => {
    const pa = a.priority === null || a.priority === undefined || a.priority === "" ? null : Number(a.priority);
    const pb = b.priority === null || b.priority === undefined || b.priority === "" ? null : Number(b.priority);
    if (pa !== null && pb !== null) return pa - pb;
    if (pa !== null) return -1;
    if (pb !== null) return 1;
    return b.id > a.id ? 1 : -1;
  });

function FinancialPlanSummary({ goals, onOpen }) {
  const [hover, setHover] = useState(null);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setReady(true), 60);
    return () => clearTimeout(t);
  }, []);

  const list = sortGoalsByPriority(goals).map((g, i) => {
    const target = Number(g.target) || 0;
    const saved = goalSaved(g);
    return { ...g, target, saved, pct: target > 0 ? Math.min(100, Math.round((saved / target) * 100)) : 0, color: FP_COLORS[i % FP_COLORS.length] };
  });
  const totalTarget = list.reduce((a, g) => a + g.target, 0);
  const totalSaved = list.reduce((a, g) => a + Math.min(g.saved, g.target), 0);
  const totalPct = totalTarget > 0 ? Math.round((totalSaved / totalTarget) * 100) : 0;

  // Concentric rings: one ring per goal (outermost = highest priority), each filled to that goal's own %.
  // (A single pie weighted by Rupiah would let one big goal hide all the small ones.)
  const n = list.length;
  const R0 = 19;
  const step = n > 1 ? Math.min(4.1, (R0 - 11.5) / (n - 1)) : 0;
  const stroke = n > 1 ? Math.min(3.3, step * 0.78) : 3.3;
  const rings = list.map((g, i) => ({ id: g.id, color: g.color, pct: g.pct, r: R0 - i * step }));

  return (
    <div className="card fp-card" role="button" tabIndex={0} onClick={onOpen} onKeyDown={(e) => e.key === "Enter" && onOpen()}>
      <div className="fp-head">
        <div>
          <h2>Financial Plan</h2>
          {list.length > 0 && (
            <p className="fp-sub">
              {rupiah(totalSaved)} terkumpul dari target {rupiah(totalTarget)}
            </p>
          )}
        </div>
        <span className="fp-link">Lihat detail →</span>
      </div>

      {list.length === 0 ? (
        <EmptyState icon={Wallet} title="Belum ada tujuan keuangan" hint="Tambahkan tujuan di Financial → Financial Plan untuk melihat progresnya di sini." />
      ) : (
        <div className="fp-body">
          <div className="fp-donut">
            <svg viewBox="0 0 42 42" role="img" aria-label={`Progres Financial Plan ${totalPct} persen`}>
              {rings.map((g) => (
                <g key={g.id} style={{ opacity: hover && hover !== g.id ? 0.3 : 1, transition: "opacity .15s" }}>
                  <circle cx="21" cy="21" r={g.r} fill="none" stroke="var(--track)" strokeWidth={stroke} />
                  <circle
                    cx="21"
                    cy="21"
                    r={g.r}
                    fill="none"
                    stroke={g.color}
                    strokeWidth={hover === g.id ? stroke + 0.9 : stroke}
                    strokeLinecap="round"
                    pathLength="100"
                    transform="rotate(-90 21 21)"
                    strokeDasharray={`${ready ? Math.max(g.pct, g.pct > 0 ? 0.8 : 0) : 0} 100`}
                    style={{ transition: "stroke-dasharray .9s cubic-bezier(.2,.8,.2,1), stroke-width .15s" }}
                  />
                </g>
              ))}
            </svg>
            <div className="fp-center">
              <span className="fp-pct">{totalPct}%</span>
              <span className="fp-pct-label">total tercapai</span>
            </div>
          </div>

          <ul className="fp-legend">
            {list.map((g) => (
              <li key={g.id} onMouseEnter={() => setHover(g.id)} onMouseLeave={() => setHover(null)} className={hover && hover !== g.id ? "dim" : ""}>
                <div className="fp-row-top">
                  <span className="fp-dot" style={{ background: g.color }} />
                  <span className="fp-name">{g.name || "(tanpa nama)"}</span>
                  {g.priority !== "" && g.priority !== null && g.priority !== undefined && <span className="fp-prio">Prioritas {g.priority}</span>}
                  <span className="fp-gpct" style={{ color: g.color }}>
                    {g.pct}%
                  </span>
                </div>
                <div className="fp-bar">
                  <div style={{ width: (ready ? g.pct : 0) + "%", background: g.color }} />
                </div>
                <div className="fp-row-sub">
                  {rupiah(g.saved)} / {rupiah(g.target)}
                  {g.targetDate ? ` · target ${fmtDate(g.targetDate)}` : ""}
                </div>
              </li>
            ))}
          </ul>
        </div>
      )}
    </div>
  );
}

function Dashboard({ data, setTab, openFinancialPlan }) {
  const periods = (data.nanny && data.nanny.periods) || [];
  const goals = (data.financial && data.financial.goals) || [];
  const eduTasks = (data.educationTodos || []).map(normalizeTask);
  const finTasks = (data.financialTodos || []).map(normalizeTask);
  const taskStats = (list) => {
    const active = list.filter((t) => t.status !== "Cancelled");
    return { done: active.filter((t) => t.status === "Complete").length, total: active.length };
  };
  const isOpenTask = (t) => t.status !== "Complete" && t.status !== "Cancelled";

  // ---- Payroll
  const periodSalary = (p) => {
    const dates = datesInRange(p.startDate, p.endDate);
    const a = dates.filter((dt) => p.attendance && p.attendance[dt] === "A").length;
    const b = dates.filter((dt) => p.attendance && p.attendance[dt] === "B").length;
    return a * (Number(p.rateA) || 0) + b * (Number(p.rateB) || 0);
  };
  const payrollPaid = periods.filter((p) => p.dibayar).length;
  const unpaid = periods.filter((p) => !p.dibayar).sort((a, b) => (b.endDate || "").localeCompare(a.endDate || ""));
  const currentPeriod = unpaid[0];

  // ---- Health
  const healthDone = data.health.filter((h) => h.status === "Selesai").length;
  const reimburseOutstanding = data.health.reduce(
    (n, h) => n + (reimburseValue(h.reimburseBlibli) !== "Paid" ? 1 : 0) + (reimburseValue(h.reimburseAdmedika) !== "Paid" ? 1 : 0),
    0
  );
  const healthPending = data.health.filter((h) => h.status !== "Selesai").length;

  // ---- Education
  const eduTodo = taskStats(eduTasks);
  const eduPortDone = data.education.reduce((a, p) => a + eduPortfolioDone(p), 0);
  const eduPortTotal = data.education.length * EDU_STAGES.length;

  // ---- Financial
  const finTodo = taskStats(finTasks);
  const totalTarget = goals.reduce((a, g) => a + (Number(g.target) || 0), 0);
  const totalSaved = goals.reduce((a, g) => a + goalSaved(g), 0);
  const finPct = totalTarget > 0 ? Math.min(100, Math.round((totalSaved / totalTarget) * 100)) : 0;

  const upcoming = useMemo(() => {
    const items = [];
    periods.forEach((p) => {
      if (!p.dibayar && p.endDate)
        items.push({ label: `Gaji nanny · ${fmtDate(p.startDate)}–${fmtDate(p.endDate)}`, date: p.endDate, kind: "Payroll", tab: "nanny" });
    });
    data.health.forEach((h) => {
      if (h.status !== "Selesai" && h.date)
        items.push({ label: [h.memberName, h.hospital || h.type].filter(Boolean).join(" · "), date: h.date, kind: "Health", tab: "kesehatan" });
    });
    eduTasks.forEach((t) => {
      if (isOpenTask(t) && t.dueDate) items.push({ label: t.task || "(tanpa nama)", date: t.dueDate, kind: "Education", tab: "pendidikan" });
    });
    finTasks.forEach((t) => {
      if (isOpenTask(t) && t.dueDate) items.push({ label: t.task || "(tanpa nama)", date: t.dueDate, kind: "Financial", tab: "budget" });
    });
    goals.forEach((g) => {
      if (g.targetDate && goalSaved(g) < (Number(g.target) || 0))
        items.push({ label: `Target tabungan · ${g.name}`, date: g.targetDate, kind: "Financial", tab: "budget" });
    });
    return items
      .map((i) => ({ ...i, d: daysUntil(i.date) }))
      .filter((i) => i.d !== null && i.d >= -1 && i.d <= 14)
      .sort((a, b) => a.d - b.d)
      .slice(0, 10);
  }, [data]);

  const cards = [
    {
      key: "nanny",
      label: "Payroll",
      icon: Users,
      color: "var(--sage-dark)",
      done: payrollPaid,
      total: periods.length,
      unit: "periode dibayar",
      lines: currentPeriod
        ? [`Periode berjalan: ${rupiah(periodSalary(currentPeriod))}`, `${fmtDate(currentPeriod.startDate)} – ${fmtDate(currentPeriod.endDate)} · belum dibayar`]
        : periods.length
        ? ["Semua periode sudah dibayar"]
        : [],
    },
    {
      key: "kesehatan",
      label: "Health",
      icon: HeartPulse,
      color: "var(--clay)",
      done: healthDone,
      total: data.health.length,
      unit: "jadwal selesai",
      lines: data.health.length ? [`${healthPending} jadwal belum selesai`, `${reimburseOutstanding} reimburse belum Paid`] : [],
    },
    {
      key: "pendidikan",
      label: "Education",
      icon: GraduationCap,
      color: "var(--pine)",
      done: eduTodo.done,
      total: eduTodo.total,
      unit: "to-do selesai",
      lines: eduPortTotal > 0 ? [`Portofolio: ${eduPortDone} / ${eduPortTotal} jenjang selesai`] : [],
    },
    {
      key: "budget",
      label: "Financial",
      icon: Wallet,
      color: "var(--mustard)",
      done: finPct,
      total: totalTarget > 0 ? 100 : 0,
      unit: "% tabungan terkumpul",
      bigSuffix: "%",
      lines: [
        ...(totalTarget > 0 ? [`${rupiahShort(totalSaved)} dari ${rupiahShort(totalTarget)}`] : []),
        ...(finTodo.total > 0 ? [`To-Do: ${finTodo.done} / ${finTodo.total} selesai`] : []),
      ],
    },
  ];

  return (
    <div className="panel">
      <div className="panel-head">
        <h1>Ringkasan Rumah Tangga</h1>
        <p className="sub">
          {new Date().toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}
        </p>
      </div>

      <FinancialPlanSummary goals={goals} onOpen={openFinancialPlan || (() => setTab("budget"))} />

      <div className="stat-grid">
        {cards.map((s) => (
          <button key={s.key} className="stat-card" onClick={() => setTab(s.key)}>
            <div className="stat-top">
              <span className="stat-icon" style={{ color: s.color }}>
                <s.icon size={18} strokeWidth={1.8} />
              </span>
              <span className="stat-label">{s.label}</span>
            </div>
            <div className="stat-num">
              {s.total === 0 ? (
                <span className="stat-empty">Belum ada data</span>
              ) : (
                <>
                  <span className="big">
                    {s.done}
                    {s.bigSuffix || ""}
                  </span>
                  <span className="of">{s.bigSuffix ? "terkumpul" : `/ ${s.total} ${s.unit.replace(/^% /, "")}`}</span>
                </>
              )}
            </div>
            <ProgressBar value={s.done} max={Math.max(s.total, 1)} color={s.color} />
            <div className="stat-lines">
              {s.lines.map((l, i) => (
                <span key={i}>{l}</span>
              ))}
            </div>
          </button>
        ))}
      </div>

      <div className="card upcoming-card upcoming-full">
        <h2>Akan Datang</h2>
        {upcoming.length === 0 ? (
          <EmptyState icon={Calendar} title="Tidak ada jadwal dekat" hint="Item dengan tanggal dalam 14 hari ke depan akan muncul di sini." />
        ) : (
          <ul className="upcoming-list">
            {upcoming.map((u, i) => (
              <li key={i} onClick={() => setTab(u.tab)}>
                <span className={"tag tag-" + u.kind.toLowerCase()}>{u.kind}</span>
                <span className="up-label">{u.label}</span>
                <span className={"up-date" + (u.d < 0 ? " overdue" : u.d <= 2 ? " soon" : "")}>
                  {u.d < 0 ? "Terlewat" : u.d === 0 ? "Hari ini" : `${u.d} hari lagi`}
                </span>
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   To-Do Tab
--------------------------------------------------------- */
function TodoTab({ data, update, appSave }) {
  const [text, setText] = useState("");
  const [cat, setCat] = useState("Rumah");
  const [pic, setPic] = useState("");
  const [due, setDue] = useState("");
  const [filter, setFilter] = useState("Semua");

  const categories = (data.masterData && data.masterData.todoCategories) || ["Rumah", "Belanja", "Nanny", "Kesehatan", "Pendidikan", "Lainnya"];

  const add = () => {
    if (!text.trim()) return;
    update((d) => ({
      ...d,
      todos: [{ id: uid(), text: text.trim(), category: cat, pic: pic.trim(), dueDate: due, done: false }, ...d.todos],
    }));
    setText("");
    setPic("");
    setDue("");
  };
  const onEnter = (e) => {
    if (e.key === "Enter") add();
  };

  const toggle = (id) =>
    update((d) => ({ ...d, todos: d.todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t)) }));

  const remove = (id) => update((d) => ({ ...d, todos: d.todos.filter((t) => t.id !== id) }));

  const list = data.todos
    .filter((t) => filter === "Semua" || t.category === filter)
    .sort((a, b) => (a.done === b.done ? (a.dueDate || "9999").localeCompare(b.dueDate || "9999") : a.done ? 1 : -1));

  return (
    <div className="panel">
      <div className="panel-head">
        <h1>To-Do List Rumah Tangga</h1>
        <p className="sub">Semua tugas rumah dalam satu daftar, ditandai per kategori.</p>
      </div>

      <PageSaveBar {...appSave} />

      <div className="add-form wrap">
        <input placeholder="Tambah tugas baru…" value={text} onChange={(e) => setText(e.target.value)} onKeyDown={onEnter} className="grow" />
        <select value={cat} onChange={(e) => setCat(e.target.value)}>
          {categories.map((c) => (
            <option key={c}>{c}</option>
          ))}
        </select>
        <input placeholder="PIC" value={pic} onChange={(e) => setPic(e.target.value)} onKeyDown={onEnter} style={{ width: 120 }} />
        <input type="date" value={due} onChange={(e) => setDue(e.target.value)} />
        <button type="button" className="btn-primary" onClick={add}>
          <Plus size={16} /> Tambah
        </button>
      </div>

      <div className="chip-row">
        {["Semua", ...categories].map((c) => (
          <button key={c} className={"chip" + (filter === c ? " chip-active" : "")} onClick={() => setFilter(c)}>
            {c}
          </button>
        ))}
      </div>

      {list.length === 0 ? (
        <EmptyState icon={CheckSquare} title="Belum ada tugas" hint="Tambahkan tugas rumah tangga pertama kamu di atas." />
      ) : (
        <ul className="list">
          {list.map((t) => {
            const d = t.dueDate ? daysUntil(t.dueDate) : null;
            return (
              <li key={t.id} className={"list-row" + (t.done ? " done" : "")}>
                <button className={"check" + (t.done ? " checked" : "")} onClick={() => toggle(t.id)}>
                  {t.done && <Check size={13} strokeWidth={3} />}
                </button>
                <div className="list-main">
                  <span className="list-title">{t.text}</span>
                  <span className="list-meta">
                    <span className={"tag tag-" + t.category.toLowerCase()}>{t.category}</span>
                    {t.pic && <span className="due">PIC: {t.pic}</span>}
                    {t.dueDate && (
                      <span className={"due" + (!t.done && d < 0 ? " overdue" : "")}>
                        {fmtDate(t.dueDate)}
                        {!t.done && d !== null && d >= 0 && d <= 2 ? " · segera" : ""}
                      </span>
                    )}
                  </span>
                </div>
                <button className="icon-btn" onClick={() => remove(t.id)}>
                  <Trash2 size={15} />
                </button>
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Nanny Tab (period-based attendance + salary)
--------------------------------------------------------- */
function NannyTab({ data, update, appSave }) {
  const periods = data.nanny.periods || [];
  const [expanded, setExpanded] = useState(() => new Set());
  const [confirmId, setConfirmId] = useState(null);
  const [confirmAmount, setConfirmAmount] = useState("");

  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  const [rateA, setRateAInput] = useState("");
  const [rateB, setRateBInput] = useState("");

  const addPeriod = () => {
    if (!startDate || !endDate) return;
    const id = uid();
    update((d) => ({
      ...d,
      nanny: {
        ...d.nanny,
        periods: [
          {
            id,
            startDate,
            endDate,
            rateA: Number(rateA) || 0,
            rateB: Number(rateB) || 0,
            attendance: {},
            dibayar: false,
            gajiDibayarkan: null,
          },
          ...(d.nanny.periods || []),
        ],
      },
    }));
    setExpanded((s) => new Set(s).add(id));
    setStartDate("");
    setEndDate("");
    setRateAInput("");
    setRateBInput("");
  };

  const removePeriod = (id) =>
    update((d) => ({ ...d, nanny: { ...d.nanny, periods: (d.nanny.periods || []).filter((p) => p.id !== id) } }));

  const openConfirm = (period, gajiSeharusnya) => {
    setConfirmId(period.id);
    setConfirmAmount(String(gajiSeharusnya || ""));
  };

  const closeConfirm = () => {
    setConfirmId(null);
    setConfirmAmount("");
  };

  const confirmPayment = () => {
    if (!confirmId) return;
    const amount = Number(confirmAmount) || 0;
    update((d) => ({
      ...d,
      nanny: {
        ...d.nanny,
        periods: (d.nanny.periods || []).map((p) =>
          p.id === confirmId ? { ...p, dibayar: true, gajiDibayarkan: amount } : p
        ),
      },
    }));
    closeConfirm();
  };

  const setPeriodRateA = (id, val) =>
    update((d) => ({
      ...d,
      nanny: {
        ...d.nanny,
        periods: (d.nanny.periods || []).map((p) => (p.id === id && !p.dibayar ? { ...p, rateA: Number(val) || 0 } : p)),
      },
    }));

  const setPeriodRateB = (id, val) =>
    update((d) => ({
      ...d,
      nanny: {
        ...d.nanny,
        periods: (d.nanny.periods || []).map((p) => (p.id === id && !p.dibayar ? { ...p, rateB: Number(val) || 0 } : p)),
      },
    }));

  // cycle a date's mark: none -> "A" (hijau) -> "B" (merah) -> none
  const cycleAttendance = (id, dateStr) =>
    update((d) => ({
      ...d,
      nanny: {
        ...d.nanny,
        periods: (d.nanny.periods || []).map((p) => {
          if (p.id !== id || p.dibayar) return p;
          const att = { ...p.attendance };
          const cur = att[dateStr];
          if (!cur) att[dateStr] = "A";
          else if (cur === "A") att[dateStr] = "B";
          else delete att[dateStr];
          return { ...p, attendance: att };
        }),
      },
    }));

  const toggleExpand = (id) =>
    setExpanded((s) => {
      const next = new Set(s);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });

  const sorted = [...periods].sort((a, b) => (a.startDate < b.startDate ? 1 : -1));
  const confirmPeriod = sorted.find((p) => p.id === confirmId);

  return (
    <div className="panel">
      <div className="panel-head">
        <h1>Payroll</h1>
        <p className="sub">Atur kehadiran per periode. Setiap periode gaji jadi satu baris data.</p>
      </div>

      <PageSaveBar {...appSave} />

      <div className="add-form wrap">
        <Field label="Mulai periode">
          <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} />
        </Field>
        <Field label="Akhir periode">
          <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} />
        </Field>
        <Field label="Rate A (hijau)">
          <input placeholder="Rp" value={rateA} onChange={(e) => setRateAInput(e.target.value.replace(/\D/g, ""))} style={{ width: 130 }} />
        </Field>
        <Field label="Rate B (merah)">
          <input placeholder="Rp" value={rateB} onChange={(e) => setRateBInput(e.target.value.replace(/\D/g, ""))} style={{ width: 130 }} />
        </Field>
        <button type="button" className="btn-primary" onClick={addPeriod} style={{ alignSelf: "flex-end" }}>
          <Plus size={16} /> Tambah Periode
        </button>
      </div>

      {sorted.length === 0 ? (
        <EmptyState icon={Users} title="Belum ada periode gaji" hint="Tambahkan periode (mis. 1–30 Agustus 2026) beserta Rate A & Rate B-nya di atas." />
      ) : (
        <div className="period-list">
          {sorted.map((p) => {
            const dates = datesInRange(p.startDate, p.endDate);
            const countA = dates.filter((dt) => p.attendance && p.attendance[dt] === "A").length;
            const countB = dates.filter((dt) => p.attendance && p.attendance[dt] === "B").length;
            const totalHadir = countA + countB;
            const gaji = countA * (Number(p.rateA) || 0) + countB * (Number(p.rateB) || 0);
            const selisih = p.dibayar ? (Number(p.gajiDibayarkan) || 0) - gaji : null;
            const isOpen = expanded.has(p.id);
            const locked = p.dibayar;
            return (
              <div className={"period-card" + (locked ? " locked" : "")} key={p.id}>
                <div className="period-head">
                  <div className="period-range">
                    <Calendar size={15} strokeWidth={1.8} />
                    <span>
                      {fmtDate(p.startDate)} – {fmtDate(p.endDate)}
                    </span>
                  </div>
                  <div className="period-actions">
                    {locked ? (
                      <span className="paid-toggle paid static">
                        <Check size={13} strokeWidth={3} /> Dibayar
                      </span>
                    ) : (
                      <button className="paid-toggle" onClick={() => openConfirm(p, gaji)}>
                        Belum dibayar
                      </button>
                    )}
                    <button className="icon-btn" onClick={() => removePeriod(p.id)}>
                      <Trash2 size={15} />
                    </button>
                  </div>
                </div>

                <div className="period-stats">
                  <div>
                    <span className="mini-label">Total kehadiran</span>
                    <span className="mini-val">{totalHadir} hari</span>
                    <span className="mini-sub">
                      <span className="rate-dot rate-a-dot" /> {countA} × A &nbsp; <span className="rate-dot rate-b-dot" /> {countB} × B
                    </span>
                  </div>
                  <div>
                    <span className="mini-label">Rate A (hijau)</span>
                    {locked ? (
                      <span className="mini-val">{rupiah(p.rateA)}</span>
                    ) : (
                      <div className="rp-input small">
                        <span>Rp</span>

const TASK_STATUSES = ["Open", "In Progress", "Complete", "Cancelled", "Hold"];

// Older to-do rows (before the table layout) used item/childName/targetDate and
// Berjalan/Selesai — read them as Task / Due Date / Status so nothing is lost.
const normalizeTask = (t) => ({
  id: t.id,
  task: t.task !== undefined ? t.task : [t.item, t.childName].filter(Boolean).join(" · "),
  pic: t.pic || "",
  dueDate: t.dueDate !== undefined ? t.dueDate : t.targetDate || "",
  status: TASK_STATUSES.includes(t.status) ? t.status : t.status === "Selesai" ? "Complete" : "Open",
});

const TASK_STATUS_COLORS = {
  Open: "#d9822b",
  "In Progress": "#1e8449",
  Complete: "#8a8a8a",
  Cancelled: "#8a8a8a",
  Hold: "#d9822b",
};

// Set of "listKey:rowId" for rows that must be completed before saving (App fills it in).
const TaskValidationContext = React.createContext({ show: false, ids: new Set() });

const isTaskRowIncomplete = (r) => !(r.task || "").trim() || !r.pic || !r.dueDate;

// Only rows that are new or edited since the last save are checked, so old
// rows that were already saved with blanks don't block anything.
const findIncompleteTasks = (data, savedJSON) => {
  const ids = new Set();
  let saved = {};
  try {
    saved = savedJSON ? JSON.parse(savedJSON) : {};
  } catch (e) {}
  ["educationTodos", "financialTodos", "careerTodos", "businessTodos"].forEach((key) => {
    const before = new Map(((saved && saved[key]) || []).map(normalizeTask).map((r) => [r.id, JSON.stringify(r)]));
    ((data && data[key]) || []).map(normalizeTask).forEach((r) => {
      if (isTaskRowIncomplete(r) && before.get(r.id) !== JSON.stringify(r)) ids.add(key + ":" + r.id);
    });
  });
  return ids;
};

const FilterIcon = ({ active }) => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill={active ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
  </svg>
);
const SortIcon = ({ dir }) => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M7 4v16M7 4L3.5 7.5M7 4l3.5 3.5" opacity={dir === "desc" ? 0.3 : 1} />
    <path d="M17 20V4M17 20l-3.5-3.5M17 20l3.5-3.5" opacity={dir === "asc" ? 0.3 : 1} />
  </svg>
);

function ColumnHeader({ label, width, sortDir, onSort, filterActive, filterContent, onResetFilter }) {
  const [pos, setPos] = useState(null);
  const popRef = useRef(null);

  useEffect(() => {
    if (!pos) return;
    const close = (e) => {
      if (popRef.current && popRef.current.contains(e.target)) return;
      setPos(null);
    };
    const closeOnScroll = () => setPos(null);
    document.addEventListener("mousedown", close);
    window.addEventListener("resize", closeOnScroll);
    window.addEventListener("scroll", closeOnScroll, true);
    return () => {
      document.removeEventListener("mousedown", close);
      window.removeEventListener("resize", closeOnScroll);
      window.removeEventListener("scroll", closeOnScroll, true);
    };
  }, [pos]);

  return (
    <th style={width ? { width } : undefined}>
      <span className="th-inner">
        <span>{label}</span>
        <span className="th-actions">
          <button type="button" className={"th-btn" + (sortDir ? " on" : "")} title="Sort" onClick={onSort}>
            <SortIcon dir={sortDir} />
          </button>
          {filterContent && (
            <button
              type="button"
              className={"th-btn" + (filterActive ? " on" : "")}
              title="Filter"
              onMouseDown={(e) => e.stopPropagation()}
              onClick={(e) => {
                const r = e.currentTarget.getBoundingClientRect();
                setPos(pos ? null : { left: Math.max(8, Math.min(r.left, window.innerWidth - 240)), top: r.bottom + 6 });
              }}
            >
              <FilterIcon active={filterActive} />
            </button>
          )}
        </span>
      </span>
      {pos && filterContent && (
        <div className="th-pop" ref={popRef} style={{ left: pos.left, top: pos.top }}>
          {filterContent}
          <button type="button" className="th-reset" onClick={onResetFilter}>
            Reset filter
          </button>
        </div>
      )}
    </th>
  );
}

const EMPTY_TASK_FILTERS = { task: "", pic: "", dueFrom: "", dueTo: "", status: [] };

function TaskTableSection({ listKey, data, update, appSave }) {
  const validation = React.useContext(TaskValidationContext);
  const rows = (data[listKey] || []).map(normalizeTask);
  const users = data.users || [];
  const roleLabel = (u) => (ROLES.find((r) => r.value === roleOf(u)) || ROLES[0]).label;

  const [sort, setSort] = useState({ key: null, dir: null });
  const [filters, setFilters] = useState(EMPTY_TASK_FILTERS);
  const setFilter = (patch) => setFilters((f) => ({ ...f, ...patch }));

  const setRows = (fn) => update((d) => ({ ...d, [listKey]: fn((d[listKey] || []).map(normalizeTask)) }));
  const filtersActive = {
    task: !!filters.task.trim(),
    pic: !!filters.pic,
    dueDate: !!(filters.dueFrom || filters.dueTo),
    status: filters.status.length > 0,
  };
  const anyFilter = Object.values(filtersActive).some(Boolean);

  const addRow = () => {
    setFilters(EMPTY_TASK_FILTERS); // so the new (empty) row is never hidden by a filter
    setRows((list) => [...list, { id: uid(), task: "", pic: "", dueDate: "", status: "Open" }]);
  };
  const editRow = (id, field, value) => setRows((list) => list.map((r) => (r.id === id ? { ...r, [field]: value } : r)));
  const removeRow = (id) => setRows((list) => list.filter((r) => r.id !== id));

  const cycleSort = (key) =>
    setSort((s) => (s.key !== key ? { key, dir: "asc" } : s.dir === "asc" ? { key, dir: "desc" } : { key: null, dir: null }));

  // View only — sorting/filtering never changes the saved data or its order.
  let view = rows.map((r, i) => ({ ...r, _i: i }));
  view = view.filter((r) => {
    if (filtersActive.task && !r.task.toLowerCase().includes(filters.task.trim().toLowerCase())) return false;
    if (filtersActive.pic && (filters.pic === "__blank__" ? r.pic : r.pic !== filters.pic)) return false;
    if (filters.dueFrom && (!r.dueDate || r.dueDate < filters.dueFrom)) return false;
    if (filters.dueTo && (!r.dueDate || r.dueDate > filters.dueTo)) return false;
    if (filtersActive.status && !filters.status.includes(r.status)) return false;
    return true;
  });
  if (sort.key) {
    const val = (r) => (sort.key === "no" ? r._i : sort.key === "status" ? TASK_STATUSES.indexOf(r.status) : (r[sort.key] || "").toString().toLowerCase());
    const dir = sort.dir === "asc" ? 1 : -1;
    view.sort((a, b) => {
      const va = val(a), vb = val(b);
      const ea = va === "", eb = vb === "";
      if (ea || eb) return ea === eb ? a._i - b._i : ea ? 1 : -1; // blanks always last
      return va < vb ? -dir : va > vb ? dir : a._i - b._i;
    });
  }
  const dirOf = (k) => (sort.key === k ? sort.dir : null);

  const cellErr = (r, empty) => validation.show && validation.ids.has(listKey + ":" + r.id) && empty;

  return (
    <>
      <PageSaveBar {...appSave} />

      <div className="task-table-wrap">
        <table className="task-table">
          <thead>
            <tr>
              <ColumnHeader label="No" width={58} sortDir={dirOf("no")} onSort={() => cycleSort("no")} />
              <ColumnHeader
                label="Task"
                sortDir={dirOf("task")}
                onSort={() => cycleSort("task")}
                filterActive={filtersActive.task}
                onResetFilter={() => setFilter({ task: "" })}
                filterContent={
                  <input autoFocus placeholder="Cari task…" value={filters.task} onChange={(e) => setFilter({ task: e.target.value })} />
                }
              />
              <ColumnHeader
                label="PIC"
                width={172}
                sortDir={dirOf("pic")}
                onSort={() => cycleSort("pic")}
                filterActive={filtersActive.pic}
                onResetFilter={() => setFilter({ pic: "" })}
                filterContent={
                  <select value={filters.pic} onChange={(e) => setFilter({ pic: e.target.value })}>
                    <option value="">Semua</option>
                    <option value="__blank__">(Kosong)</option>
                    {users.map((u) => (
                      <option key={u.id} value={u.username}>
                        {u.username} ({roleLabel(u)})
                      </option>
                    ))}
                  </select>
                }
              />
              <ColumnHeader
                label="Due Date"
                width={134}
                sortDir={dirOf("dueDate")}
                onSort={() => cycleSort("dueDate")}
                filterActive={filtersActive.dueDate}
                onResetFilter={() => setFilter({ dueFrom: "", dueTo: "" })}
                filterContent={
                  <div className="th-pop-col">
                    <label>
                      Dari
                      <input type="date" value={filters.dueFrom} onChange={(e) => setFilter({ dueFrom: e.target.value })} />
                    </label>
                    <label>
                      Sampai
                      <input type="date" value={filters.dueTo} onChange={(e) => setFilter({ dueTo: e.target.value })} />
                    </label>
                  </div>
                }
              />
              <ColumnHeader
                label="Status"
                width={118}
                sortDir={dirOf("status")}
                onSort={() => cycleSort("status")}
                filterActive={filtersActive.status}
                onResetFilter={() => setFilter({ status: [] })}
                filterContent={
                  <div className="th-pop-col">
                    {TASK_STATUSES.map((s) => (
                      <label key={s} className="th-check" style={{ color: TASK_STATUS_COLORS[s] }}>
                        <input
                          type="checkbox"
                          checked={filters.status.includes(s)}
                          onChange={(e) => setFilter({ status: e.target.checked ? [...filters.status, s] : filters.status.filter((x) => x !== s) })}
                        />
                        {s}
                      </label>
                    ))}
                  </div>
                }
              />
              <th style={{ width: 36 }}></th>
            </tr>
          </thead>
          <tbody>
            {view.length === 0 && (
              <tr>
                <td colSpan={6} className="task-empty">
                  {rows.length === 0 ? 'Belum ada task. Klik "Tambah Baris" untuk menambahkan.' : "Tidak ada baris yang cocok dengan filter."}
                </td>
              </tr>
            )}
            {view.map((r, i) => {
              const color = TASK_STATUS_COLORS[r.status];
              return (
                <tr key={r.id}>
                  <td className="task-no">{i + 1}</td>
                  <td>
                    <input
                      className={cellErr(r, !r.task.trim()) ? "cell-err" : ""}
                      value={r.task}
                      placeholder="Task…"
                      onChange={(e) => editRow(r.id, "task", e.target.value)}
                    />
                  </td>
                  <td>
                    <select className={cellErr(r, !r.pic) ? "cell-err" : ""} value={r.pic} onChange={(e) => editRow(r.id, "pic", e.target.value)}>
                      <option value="">— pilih PIC —</option>
                      {r.pic && !users.some((u) => u.username === r.pic) && <option value={r.pic}>{r.pic}</option>}
                      {users.map((u) => (
                        <option key={u.id} value={u.username}>
                          {u.username} ({roleLabel(u)})
                        </option>
                      ))}
                    </select>
                  </td>
                  <td>
                    <input
                      className={cellErr(r, !r.dueDate) ? "cell-err" : ""}
                      type="date"
                      value={r.dueDate}
                      onChange={(e) => editRow(r.id, "dueDate", e.target.value)}
                    />
                  </td>
                  <td>
                    <select
                      value={r.status}
                      onChange={(e) => editRow(r.id, "status", e.target.value)}
                      style={{ color, fontWeight: 600, background: color + "1f", borderColor: color + "66" }}
                    >
                      {TASK_STATUSES.map((s) => (
                        <option key={s} style={{ color: TASK_STATUS_COLORS[s], background: "#fff" }}>
                          {s}
                        </option>
                      ))}
                    </select>
                  </td>
                  <td>

function EducationPlanSection({ data, update, dirty, saving, lastSavedAt, saveError, onSave }) {
  const portfolios = data.education || [];

  const [childName, setChildName] = useState("");

  const addPortfolio = () => {
    if (!childName.trim()) return;
    update((d) => ({
      ...d,
      education: [{ id: uid(), childName: childName.trim(), stages: emptyEduStages() }, ...(d.education || [])],
    }));
    setChildName("");
  };

  const removePortfolio = (id) => update((d) => ({ ...d, education: (d.education || []).filter((p) => p.id !== id) }));

  const setStageField = (portfolioId, stageKey, field, val) =>
    update((d) => ({
      ...d,
      education: (d.education || []).map((p) => {
        if (p.id !== portfolioId) return p;
        const stages = { ...p.stages };
        stages[stageKey] = { ...(stages[stageKey] || {}), [field]: field === "cost" ? Number(val) || 0 : val };
        return { ...p, stages };
      }),
    }));

  return (
    <>
      <div className="save-bar">
        {saveError && <span className="save-status dirty">Gagal menyimpan ke Supabase, coba lagi</span>}
        <button type="button" className="btn-primary" onClick={onSave} disabled={saving || !dirty} style={{ marginLeft: "auto" }}>
          {saving ? <Loader2 size={16} className="spin" /> : <Check size={16} />} Save
        </button>
      </div>

      <div className="add-form wrap">
        <Field label="Nama anak">
          <input placeholder="mis. Aira" value={childName} onChange={(e) => setChildName(e.target.value)} className="grow" />
        </Field>
        <button type="button" className="btn-primary" onClick={addPortfolio} style={{ alignSelf: "flex-end" }}>
          <Plus size={16} /> Tambah Anak
        </button>
      </div>

      {portfolios.length === 0 ? (
        <EmptyState icon={GraduationCap} title="Belum ada portofolio pendidikan" hint="Tambahkan nama anak untuk mulai menyusun rencana TK sampai Kuliah." />
      ) : (
        <div className="period-list">
          {portfolios.map((p) => {
            const total = eduPortfolioTotal(p);
            const done = eduPortfolioDone(p);
            return (
              <div className="period-card" key={p.id}>
                <div className="period-head">
                  <div className="period-range">
                    <GraduationCap size={15} strokeWidth={1.8} />
                    <span>{p.childName}</span>
                    <span className="tag tag-pendidikan">{done} / {EDU_STAGES.length} jenjang selesai</span>
                  </div>
                  <div className="period-actions">
                    <span className="mini-val" style={{ fontSize: 15 }}>{rupiah(total)}</span>
                    <button className="icon-btn" onClick={() => removePortfolio(p.id)}>
                      <Trash2 size={15} />
                    </button>
                  </div>
                </div>

                <div className="edu-table">
                  <div className="edu-row edu-row-head">
                    <span>Jenjang</span>
                    <span>Institusi</span>
                    <span>Mulai</span>
                    <span>Selesai</span>
                    <span>Estimasi Biaya</span>
                    <span>Status</span>
                  </div>
                  {EDU_STAGES.map((s) => (
                    <EduStageRow
                      key={s.key}
                      stage={s}
                      data={(p.stages && p.stages[s.key]) || {}}
                      onChange={(field, val) => setStageField(p.id, s.key, field, val)}

                  ))}

            );
          })}
        </div>

function GoalCard({ users, goal, expanded, onToggleExpand, onRemove, onUpdateField, onAddContribution, onRemoveContribution }) {
  const [contribDate, setContribDate] = useState(todayISO());
  const [contribAmount, setContribAmount] = useState("");
  const [contribBank, setContribBank] = useState("");
  const [contribTipe, setContribTipe] = useState("Tabungan");

  const saved = goalSaved(goal);
  const remaining = Math.max(0, (Number(goal.target) || 0) - saved);
  const pct = goal.target > 0 ? Math.min(100, Math.round((saved / goal.target) * 100)) : 0;
  const est = goalEstimate(goal);

  const submit = () => {
    if (!contribAmount) return;
    onAddContribution(contribDate, contribAmount, contribBank, contribTipe);
    setContribAmount("");
    setContribBank("");
  };

  return (
    <div className="period-card">
      <div className="period-head">
        <div className="period-range">
          <PiggyBank size={15} strokeWidth={1.8} />
          <input
            className="goal-name-input"
            value={goal.name}
            onChange={(e) => onUpdateField("name", e.target.value)}
            placeholder="Nama tujuan"
          />
        </div>
        <div className="period-actions">
          <span className="mini-val" style={{ fontSize: 15 }}>{pct}%</span>
          <button className="icon-btn" onClick={onRemove}>
            <Trash2 size={15} />
          </button>
        </div>
      </div>

      <div className="period-stats">
        <div>
          <span className="mini-label">Target</span>
          <div className="rp-input small">
            <span>Rp</span>
            <input value={goal.target || ""} onChange={(e) => onUpdateField("target", e.target.value.replace(/\D/g, ""))} placeholder="0" />
          </div>
        </div>
        <div>
          <span className="mini-label">Target tanggal</span>
          <input
            type="date"
            className="goal-date-input"
            value={goal.targetDate || ""}
            onChange={(e) => onUpdateField("targetDate", e.target.value)}
          />
        </div>
        <div>
          <span className="mini-label">Priority</span>
          <input
            className="goal-priority-input"
            value={goal.priority ?? ""}
            onChange={(e) => onUpdateField("priority", e.target.value.replace(/\D/g, ""))}
            placeholder="—"
          />
        </div>
        <div>
          <span className="mini-label">PIC</span>
          <PicSelect className="goal-pic-select" value={goal.pic} onChange={(v) => onUpdateField("pic", v)} users={users} />
        </div>
        <div>
          <span className="mini-label">Terkumpul</span>
          <span className="mini-val">{rupiah(saved)}</span>
        </div>
        <div>
          <span className="mini-label">Sisa</span>
          <span className="mini-val">{rupiah(remaining)}</span>
        </div>
        {est && est.monthsToGo && (
          <div>
            <span className="mini-label">Estimasi tercapai</span>
            <span className="mini-val" style={{ fontSize: 14 }}>~{est.monthsToGo} bulan lagi</span>
          </div>
        )}
      </div>
      <ProgressBar value={saved} max={Math.max(goal.target, saved, 1)} color="var(--sage-dark)" />

      <button className="expand-btn" onClick={onToggleExpand} style={{ marginTop: 12 }}>
        {expanded ? "Tutup riwayat setoran" : "Atur setoran"}
      </button>

      {expanded && (
        <>
          <div className="add-form wrap" style={{ marginTop: 12 }}>
            <input type="date" value={contribDate} onChange={(e) => setContribDate(e.target.value)} />
            <div className="rp-input small">
              <span>Rp</span>
              <input value={contribAmount} onChange={(e) => setContribAmount(e.target.value.replace(/\D/g, ""))} placeholder="0" />
            </div>
            <input placeholder="Bank" value={contribBank} onChange={(e) => setContribBank(e.target.value)} style={{ width: 130 }} />
            <select value={contribTipe} onChange={(e) => setContribTipe(e.target.value)}>
              {["Tabungan", "Deposito", "Reksadana", "Saham", "Emas", "Lainnya"].map((t) => (
                <option key={t}>{t}</option>
              ))}
            </select>
            <button type="button" className="btn-primary" onClick={submit}>
              <Plus size={16} /> Tambah Setoran
            </button>
          </div>
          {(goal.contributions || []).length === 0 ? (
            <p className="empty-hint">Belum ada setoran tercatat.</p>
          ) : (
            <ul className="list">
              {[...goal.contributions].sort((a, b) => (a.date < b.date ? 1 : -1)).map((c) => (
                <li key={c.id} className="list-row">
                  <div className="list-main">
                    <span className="list-title">{fmtDate(c.date)}</span>
                    {(c.bank || c.tipe) && (
                      <span className="list-meta">
                        {c.bank && <span className="due">{c.bank}</span>}
                        {c.tipe && <span className="tag tag-rumah">{c.tipe}</span>}
                      </span>
                    )}
                  </div>
                  <span className="due">{rupiah(c.amount)}</span>
                  <button className="icon-btn" onClick={() => onRemoveContribution(c.id)}>
                    <Trash2 size={15} />
                  </button>
                </li>
              ))}
            </ul>
          )}
        </>
      )}
    </div>
  );
}

function SavingsGoalsSection({ data, update }) {
  const goals = data.financial.goals || [];
  const [expanded, setExpanded] = useState(() => new Set());

  const [name, setName] = useState("");
  const [target, setTarget] = useState("");
  const [targetDate, setTargetDate] = useState("");
  const [priority, setPriority] = useState("");
  const [pic, setPic] = useState("");
  const users = data.users || [];
  const [addError, setAddError] = useState("");

  const addGoal = () => {
    if (!name.trim() || !target || Number(target) <= 0) {
      setAddError(
        !name.trim() && !(Number(target) > 0)
          ? "Isi Nama tujuan dan Target nominal terlebih dahulu."
          : !name.trim()
          ? "Nama tujuan belum diisi."
          : "Target nominal belum diisi (harus lebih dari 0)."
      );
      return;
    }
    setAddError("");
    const id = uid();
    update((d) => ({
      ...d,
      financial: {
        ...d.financial,
        goals: [
          { id, name: name.trim(), target: Number(target) || 0, targetDate, priority: priority ? Number(priority) : null, pic, contributions: [] },
          ...(d.financial.goals || []),
        ],
      },
    }));
    setExpanded((s) => new Set(s).add(id));
    setName("");
    setTarget("");
    setTargetDate("");
    setPriority("");
    setPic("");
  };

  const removeGoal = (id) => update((d) => ({ ...d, financial: { ...d.financial, goals: (d.financial.goals || []).filter((g) => g.id !== id) } }));

  const updateGoalField = (id, field, value) =>
    update((d) => ({
      ...d,
      financial: {
        ...d.financial,
        goals: (d.financial.goals || []).map((g) => {
          if (g.id !== id) return g;
          if (field === "target") return { ...g, target: Number(value) || 0 };
          if (field === "priority") return { ...g, priority: value === "" ? null : Number(value) };
          return { ...g, [field]: value };
        }),
      },
    }));

  const toggleExpand = (id) =>
    setExpanded((s) => {
      const next = new Set(s);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });

  const addContribution = (goalId, date, amount, bank, tipe) =>
    update((d) => ({
      ...d,
      financial: {
        ...d.financial,
        goals: (d.financial.goals || []).map((g) =>
          g.id === goalId
            ? { ...g, contributions: [{ id: uid(), date, amount: Number(amount) || 0, bank, tipe }, ...(g.contributions || [])] }
            : g
        ),
      },
    }));

  const removeContribution = (goalId, cid) =>
    update((d) => ({
      ...d,
      financial: {
        ...d.financial,
        goals: (d.financial.goals || []).map((g) =>
          g.id === goalId ? { ...g, contributions: (g.contributions || []).filter((c) => c.id !== cid) } : g
        ),
      },
    }));

  // Goals with a priority set sort to the top, lowest number first; goals
  // without a priority keep their original (most-recently-added-first) order
  // and stay below all prioritized ones.
  const sorted = [...goals].sort((a, b) => {
    const pa = a.priority === null || a.priority === undefined || a.priority === "" ? null : Number(a.priority);
    const pb = b.priority === null || b.priority === undefined || b.priority === "" ? null : Number(b.priority);
    if (pa !== null && pb !== null) return pa - pb;
    if (pa !== null) return -1;
    if (pb !== null) return 1;
    return b.id > a.id ? 1 : -1;
  });

  return (
    <>
      <div className="add-form wrap">
        <Field label="Nama tujuan">
          <input placeholder="mis. Renovasi Dapur" value={name} onChange={(e) => setName(e.target.value)} className="grow" />
        </Field>
        <Field label="Target nominal">
          <div className="rp-input small">
            <span>Rp</span>
            <input value={target} onChange={(e) => setTarget(e.target.value.replace(/\D/g, ""))} placeholder="0" />
          </div>
        </Field>
        <Field label="Target tanggal (opsional)">
          <input type="date" value={targetDate} onChange={(e) => setTargetDate(e.target.value)} />
        </Field>
        <Field label="Priority (opsional)">
          <input
            value={priority}
            onChange={(e) => setPriority(e.target.value.replace(/\D/g, ""))}
            placeholder="1, 2, 3…"
            style={{ width: 90 }}
          />
        </Field>
        <Field label="PIC (opsional)">
          <PicSelect value={pic} onChange={setPic} users={users} />
        </Field>
        <button type="button" className="btn-primary" onClick={addGoal} style={{ alignSelf: "flex-end" }}>
          <Plus size={16} /> Tambah Tujuan
        </button>
      </div>
      {addError && <p className="empty-hint" style={{ color: "var(--clay)", margin: "-8px 0 12px", maxWidth: "none" }}>{addError}</p>}

      {sorted.length === 0 ? (
        <EmptyState icon={PiggyBank} title="Belum ada tujuan tabungan" hint="Tambahkan tujuan tabungan atau investasi untuk mulai melacak progres." />
      ) : (
        <div className="period-list">
          {sorted.map((g) => (
            <GoalCard
              users={users}
              key={g.id}
              goal={g}
              expanded={expanded.has(g.id)}
              onToggleExpand={() => toggleExpand(g.id)}
              onRemove={() => removeGoal(g.id)}
              onUpdateField={(field, value) => updateGoalField(g.id, field, value)}
              onAddContribution={(date, amount, bank, tipe) => addContribution(g.id, date, amount, bank, tipe)}
              onRemoveContribution={(cid) => removeContribution(g.id, cid)}
            />
          ))}
        </div>
      )}
    </>
  );
}

/* ---------------------------------------------------------
   User Management Tab
--------------------------------------------------------- */
function UserManagementTab({ data, update, appSave, currentUsername }) {
  const users = data.users || [];
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [role, setRole] = useState("user");
  const [error, setError] = useState("");
  const superAdminCount = users.filter((u) => roleOf(u) === "super_admin").length;

  const changeRole = (id, newRole) => {
    const target = users.find((u) => u.id === id);
    if (target && target.username === currentUsername) {
      setError("Tidak bisa mengubah role akun yang sedang login.");
      return;
    }
    if (target && roleOf(target) === "super_admin" && newRole !== "super_admin" && superAdminCount <= 1) {
      setError("Tidak bisa diubah — minimal harus ada 1 Super Admin.");
      return;
    }
    update((d) => ({ ...d, users: (d.users || []).map((u) => (u.id === id ? { ...u, role: newRole } : u)) }));
    setError("");
  };

  const addUser = () => {
    if (!username.trim() || !password) return;
    if (users.some((u) => u.username.toLowerCase() === username.trim().toLowerCase())) {
      setError("Username sudah dipakai.");
      return;
    }
    update((d) => ({ ...d, users: [...(d.users || []), { id: uid(), username: username.trim(), password, role }] }));
    setUsername("");
    setPassword("");
    setError("");
  };

  const removeUser = (id, uname) => {
    if (users.length <= 1) {
      setError("Tidak bisa hapus — minimal harus ada 1 user.");
      return;
    }
    const target = users.find((u) => u.id === id);
    if (target && roleOf(target) === "super_admin" && superAdminCount <= 1) {
      setError("Tidak bisa hapus — minimal harus ada 1 Super Admin.");
      return;
    }
    if (uname === currentUsername) {
      setError("Tidak bisa hapus user yang sedang login.");
      return;
    }
    update((d) => ({ ...d, users: (d.users || []).filter((u) => u.id !== id) }));
    setError("");
  };

  return (
    <div className="panel">
      <div className="panel-head">
        <h1>User Management</h1>
        <p className="sub">Atur siapa saja yang bisa login ke halaman ini.</p>
      </div>

      <PageSaveBar {...appSave} />

      <div className="add-form wrap">
        <input placeholder="Username" value={username} onChange={(e) => setUsername(e.target.value)} style={{ width: 160 }} />
        <input placeholder="Password" type="text" value={password} onChange={(e) => setPassword(e.target.value)} style={{ width: 160 }} />
        <select value={role} onChange={(e) => setRole(e.target.value)}>
          {ROLES.map((r) => (
            <option key={r.value} value={r.value}>
              {r.label}
            </option>
          ))}
        </select>
        <button type="button" className="btn-primary" onClick={addUser}>
          <Plus size={16} /> Tambah User
        </button>
      </div>
      {error && <p className="empty-hint" style={{ color: "var(--clay)", marginTop: -8, marginBottom: 12 }}>{error}</p>}

      {users.length === 0 ? (
        <EmptyState icon={UserCog} title="Belum ada user" hint="Tambahkan user pertama di atas." />
      ) : (
        <ul className="list">
          {users.map((u) => (
            <li key={u.id} className="list-row">
              <div className="list-main">
                <span className="list-title">{u.username}</span>
                {u.username === currentUsername && <span className="tag tag-rumah">Sedang login</span>}
              </div>
              <select value={roleOf(u)} onChange={(e) => changeRole(u.id, e.target.value)} style={{ fontSize: 12.5 }}>
                {ROLES.map((r) => (
                  <option key={r.value} value={r.value}>
                    {r.label}
                  </option>
                ))}
              </select>
              <button className="icon-btn" onClick={() => removeUser(u.id, u.username)}>
                <Trash2 size={15} />
              </button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Login Page
--------------------------------------------------------- */
function LoginPage({ users, onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const submit = () => {
    const found = (users || []).find((u) => u.username === username && u.password === password);
    if (found) {
      setError("");
      onLogin(found.username);
    } else {
      setError("Username atau password salah.");
    }
  };
  const onEnter = (e) => {
    if (e.key === "Enter") submit();
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-brand">
          <Lock size={20} strokeWidth={1.8} />
          <span>Griya Household Planner</span>
        </div>
        <Field label="Username">
          <input value={username} onChange={(e) => setUsername(e.target.value)} onKeyDown={onEnter} autoFocus />
        </Field>
        <Field label="Password">
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={onEnter} />
        </Field>
        {error && <p className="login-error">{error}</p>}
        <button type="button" className="btn-primary login-btn" onClick={submit}>
          Login
        </button>
      </div>
    </div>
  );
}

   App shell
--------------------------------------------------------- */

  { key: "dashboard", label: "Dashboard", icon: LayoutDashboard },
  { key: "todo", label: "To-Do", icon: CheckSquare },
];

const NAV_GROUP = {
  label: "Category",
  items: [
    { key: "nanny", label: "Payroll", icon: Users },
    { key: "kesehatan", label: "Health", icon: HeartPulse },
    { key: "pendidikan", label: "Education", icon: GraduationCap },
    { key: "budget", label: "Financial", icon: Wallet },
    { key: "career", label: "Career", icon: Briefcase },
    { key: "business", label: "Business", icon: Store },
  ],
};

const NAV_SETTINGS_GROUP = {
  label: "Pengaturan",
  items: [
    { key: "masterdata", label: "Master Data", icon: Database },
    { key: "usermanagement", label: "User Management", icon: UserCog },
  ],
};

function App() {
  const [tab, setTab] = useState("dashboard");
  const [categoryOpen, setCategoryOpen] = useState(true);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const remoteVersionRef = useRef(null); // updated_at of the row this browser last loaded/saved
  const stateRef = useRef({});

  // --- Auth (client-side only — good enough for a personal household app,
  // not real security since credentials live in the same local/Supabase store) ---
  const [authedUsername, setAuthedUsername] = useState(null);

  // --- Global data persistence (manual save only — no auto-save) ---
  const [savedDataSnapshot, setSavedDataSnapshot] = useState(null); // baseline = whatever was loaded
  const [appDirty, setAppDirty] = useState(false);
  const [appSaving, setAppSaving] = useState(false);
  const [appSavedAt, setAppSavedAt] = useState(null);
  const [appSaveError, setAppSaveError] = useState(false);

  // --- Education Plan → Supabase (manual save only) ---
  const [eduSubTab, setEduSubTab] = useState("todo");
  const [finSubTab, setFinSubTab] = useState("todo");
  const [savedEduSnapshot, setSavedEduSnapshot] = useState(null); // null until remote baseline is known
  const [eduPlanDirty, setEduPlanDirty] = useState(false);
  const [eduSaving, setEduSaving] = useState(false);
  const [eduLastSavedAt, setEduLastSavedAt] = useState(null);
  const [eduSaveError, setEduSaveError] = useState(false);
  const [pendingAction, setPendingAction] = useState(null);
  const [showLeaveModal, setShowLeaveModal] = useState(false);
  const [incompleteModal, setIncompleteModal] = useState(null); // null | "save" | "nav"
  const [showTaskErrors, setShowTaskErrors] = useState(false);
  const incompleteIds = findIncompleteTasks(data, savedDataSnapshot);
  const hasIncomplete = incompleteIds.size > 0;
  const isOnEduPlan = tab === "pendidikan" && eduSubTab === "plan";

  // Restore a login for this browser tab session (cleared on tab close).
  useEffect(() => {
    if (loading || !data) return;
    try {
      const saved = sessionStorage.getItem("griya-authed-username");
      if (saved && (data.users || []).some((u) => u.username === saved)) {
        setAuthedUsername(saved);
      }
    } catch (e) {
      /* sessionStorage unavailable — just require login each load */
    }
  }, [loading, data]);

  const handleLogin = (username) => {
    setTab("dashboard");
    setAuthedUsername(username);
    try {
      sessionStorage.setItem("griya-authed-username", username);
    } catch (e) {}
  };

  const handleLogout = () => {
    setTab("dashboard");
    setAuthedUsername(null);
    try {
      sessionStorage.removeItem("griya-authed-username");
    } catch (e) {}
  };

  const mergeWithDefaults = (raw) => ({
    ...emptyData(),
    ...raw,
    nanny: { ...emptyData().nanny, ...raw.nanny },
    budget: { ...emptyData().budget, ...raw.budget },
    financial: { ...emptyData().financial, ...raw.financial },
    masterData: { ...emptyData().masterData, ...raw.masterData },
    users: raw.users && raw.users.length ? raw.users : emptyData().users,
  });

  const initialLoad = async () => {
    setLoading(true);
    setLoadError(false);
    const r = await fetchHouseholdDataRemote();
    if (!r.ok) {
      // Never fall back to empty defaults — that would look like "lost data"
      // and risk overwriting the real data on the next Save.
      setLoadError(true);
      setLoading(false);
      return;
    }
    const merged = mergeWithDefaults(r.data || {});
    remoteVersionRef.current = r.updatedAt;
    setData(merged);
    setSavedDataSnapshot(JSON.stringify(merged));
    setLoading(false);
  };

  useEffect(() => {
    initialLoad();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Pull in other users' changes whenever there's nothing unsaved locally.
  const refreshFromServer = async () => {
    const st = stateRef.current;
    if (st.busy || st.dirty) return;
    const r = await fetchHouseholdDataRemote();
    if (!r.ok || !r.data) return;
    if (r.updatedAt === remoteVersionRef.current) return;
    const st2 = stateRef.current;
    if (st2.busy || st2.dirty) return;
    const merged = mergeWithDefaults(r.data);
    remoteVersionRef.current = r.updatedAt;
    setData(merged);
    setSavedDataSnapshot(JSON.stringify(merged));
  };

  useEffect(() => {
    if (loading || loadError) return;
    const tick = () => { if (document.visibilityState !== "hidden") refreshFromServer(); };
    const iv = setInterval(tick, 20000);
    window.addEventListener("focus", tick);
    document.addEventListener("visibilitychange", tick);
    return () => {
      clearInterval(iv);
      window.removeEventListener("focus", tick);
      document.removeEventListener("visibilitychange", tick);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loading, loadError]);

  const update = (fn) => {
    setData((prev) => {
      const next = typeof fn === "function" ? fn(prev) : fn;
      return next;
    });
  };

  // Nothing auto-persists — this only tracks whether there's something to save.
  useEffect(() => {
    if (loading || !data || savedDataSnapshot === null) return;
    setAppDirty(JSON.stringify(data) !== savedDataSnapshot);
  }, [data, loading, savedDataSnapshot]);

  const saveApp = async () => {
    if (!data) return false;
    if (hasIncomplete) {
      setShowTaskErrors(true);
      setIncompleteModal("save");
      return false;
    }
    setAppSaving(true);
    setAppSaveError(false);
    try {
      let toSave = data;
      // Someone else may have saved since we loaded — merge instead of overwriting.
      const r = await fetchHouseholdDataRemote();
      if (!r.ok) throw new Error("Supabase unreachable");
      if (r.data && r.updatedAt !== remoteVersionRef.current) {
        const base = savedDataSnapshot ? JSON.parse(savedDataSnapshot) : {};
        toSave = mergeWithDefaults(mergeThreeWay(base, data, mergeWithDefaults(r.data)));
      }
      const savedAt = await saveHouseholdDataRemote(toSave);
      if (!savedAt) throw new Error("Supabase save failed");
      remoteVersionRef.current = savedAt;
      setSavedDataSnapshot(JSON.stringify(toSave));
      if (toSave !== data) setData(toSave);
      setAppDirty(false);
      setAppSavedAt(new Date());
      return true;
    } catch (err) {
      setAppSaveError(true);
      return false;
    } finally {
      setAppSaving(false);
    }
  };

  // Bundled for PageSaveBar — every page's Save button drives this same
  // underlying save (there's one shared store), just triggered per-page.
  stateRef.current = { busy: appSaving || eduSaving || showLeaveModal || !!incompleteModal, dirty: appDirty || eduPlanDirty };
  const appSave = { dirty: appDirty, saving: appSaving, savedAt: appSavedAt, error: appSaveError, onSave: saveApp };

  // Once local data has loaded, fetch the last-saved Education Plan snapshot
  // from Supabase to establish the "saved" baseline for dirty-checking.
  useEffect(() => {
    if (loading || !data) return;
    (async () => {
      try {
        const remote = await fetchEducationPlanRemote();
        if (remote) {
          setSavedEduSnapshot(JSON.stringify(remote));
          if (!data.education || data.education.length === 0) {
            // Syncing in a previously-saved plan isn't a new local edit —
            // fold it into the "saved" baseline too, or the global Save
            // button would wrongly show unsaved changes on every page.
            const synced = { ...data, education: remote };
            update(() => synced);
            setSavedDataSnapshot(JSON.stringify(synced));
          }
        } else {
          setSavedEduSnapshot(JSON.stringify(data.education || []));
        }
      } catch (err) {
        setSavedEduSnapshot(JSON.stringify(data.education || []));
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loading]);

  useEffect(() => {
    if (savedEduSnapshot === null || !data) return;
    setEduPlanDirty(JSON.stringify(data.education) !== savedEduSnapshot);
  }, [data, savedEduSnapshot]);

  const saveEducationPlan = async () => {
    if (!data) return false;
    setEduSaving(true);
    setEduSaveError(false);
    try {
      await saveEducationPlanRemote(data.education);
      setSavedEduSnapshot(JSON.stringify(data.education));
      setEduPlanDirty(false);
      setEduLastSavedAt(new Date());
      return true;
    } catch (err) {
      console.error("saveEducationPlan error", err);
      setEduSaveError(true);
      return false;
    } finally {
      setEduSaving(false);
    }
  };

  const currentUser = data ? (data.users || []).find((u) => u.username === authedUsername) : null;
  const allowedTabs = ROLE_TABS[roleOf(currentUser)];
  const canAccess = (key) => allowedTabs.includes(key);
  useEffect(() => {
    if (authedUsername && data && !canAccess(tab)) setTab("dashboard");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [authedUsername, data, tab]);
  const visibleNavTop = NAV_TOP.filter((n) => canAccess(n.key));
  const visibleNavGroup = NAV_GROUP.items.filter((n) => canAccess(n.key));
  const visibleNavSettings = NAV_SETTINGS_GROUP.items.filter((n) => canAccess(n.key));

  const guardedNavigate = (actionFn) => {
    if (hasIncomplete) {
      setShowTaskErrors(true);
      setPendingAction(() => actionFn);
      setIncompleteModal("nav");
      return;
    }
    if (appDirty || (isOnEduPlan && eduPlanDirty)) {
      setPendingAction(() => actionFn);
      setShowLeaveModal(true);
    } else {
      actionFn();
    }
  };

  // "Continue without saving" discards the unsaved edits — the UI should
  // revert to the last actually-saved state immediately, not just skip
  // persisting while leaving the (still unsaved) edits visible.
  const handleContinueWithoutSaving = () => {
    let reverted = data;
    if (appDirty && savedDataSnapshot !== null) {
      reverted = JSON.parse(savedDataSnapshot);
    }
    if (isOnEduPlan && eduPlanDirty && savedEduSnapshot !== null) {
      reverted = { ...reverted, education: JSON.parse(savedEduSnapshot) };
    }
    if (reverted !== data) setData(reverted);
    setShowLeaveModal(false);
    setIncompleteModal(null);
    setShowTaskErrors(false);
    if (pendingAction) pendingAction();
    setPendingAction(null);
  };

  const handleSaveAndContinue = async () => {
    let ok = true;
    if (appDirty) {
      const r = await saveApp();
      ok = ok && r;
    }
    if (isOnEduPlan && eduPlanDirty) {
      const r2 = await saveEducationPlan();
      ok = ok && r2;
    }
    setShowLeaveModal(false);
    if (ok && pendingAction) pendingAction();
    setPendingAction(null);
  };

  // Warn on actual browser tab close / refresh too, as a safety net —
  // the browser shows its own generic prompt here (can't be customized).
  useEffect(() => {
    const handler = (e) => {
      if (!eduPlanDirty && !appDirty) return;
      e.preventDefault();
      e.returnValue = "";
    };
    window.addEventListener("beforeunload", handler);
    return () => window.removeEventListener("beforeunload", handler);
  }, [eduPlanDirty, appDirty]);

  useEffect(() => {
    if (!hasIncomplete) setShowTaskErrors(false);
  }, [hasIncomplete]);

  return (
    <TaskValidationContext.Provider value={{ show: showTaskErrors, ids: incompleteIds }}>
    <div className="app-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

        }

        /* Sidebar */

          width:180px;

        }

        /* Main */
        .main{flex:1;min-width:0;padding:34px 40px 60px;max-width:1090px;}
        .panel-head{margin-bottom:22px;}

        .sub{color:var(--ink-soft);font-size:13.5px;margin:5px 0 0;}

        /* Stat grid (dashboard) */
        .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}

        .dash-lower{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start;}
        .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;}
        .card h2{font-size:16px;margin-bottom:14px;}

        .upcoming-full{max-width:640px;}
        .upcoming-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
        .upcoming-list li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
        .upcoming-list li:last-child{border-bottom:none;}
        .up-label{flex:1;font-size:13px;}
        .up-date{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
        .up-date.soon{color:var(--clay);font-weight:600;}
        .up-date.overdue{color:var(--clay);font-weight:700;}

        .budget-rows{display:flex;flex-direction:column;gap:12px;}

        .budget-figs{color:var(--ink-soft);}
        .budget-figs .of{color:var(--ink-soft);}
        .budget-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;}
        .budget-total strong{font-family:'Fraunces',serif;font-size:16px;}
        .budget-total .of{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:400;color:var(--ink-soft);}

        /* progress bar */
        .pbar{height:6px;border-radius:4px;overflow:hidden;width:100%;}
        .pbar-fill{height:100%;border-radius:4px;transition:width .3s ease;}

        /* empty state */
        .empty-state{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:26px 4px;color:var(--ink-soft);}
        .empty-title{font-size:13.5px;font-weight:600;color:var(--ink);margin:2px 0 0;}
        .empty-hint{font-size:12.5px;margin:0;max-width:360px;}

        /* forms */
        .add-form{display:flex;gap:8px;margin-bottom:16px;align-items:center;}
        .add-form.wrap{flex-wrap:wrap;}
        .add-form input, .add-form select{
          font-family:'Inter',sans-serif;
          font-size:13px;
          padding:9px 10px;
          border:1px solid var(--line);
          border-radius:7px;
          background:var(--card);
          color:var(--ink);
        }
        .add-form input:focus, .add-form select:focus{outline:2px solid var(--pine);outline-offset:1px;}

        .btn-primary{
          display:flex;align-items:center;gap:6px;

          padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;
          cursor:pointer;white-space:nowrap;
        }
        .btn-primary:hover{background:#264c42;}

        /* chips / subtabs */
        .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
        .chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:500;color:var(--ink-soft);cursor:pointer;}
        .chip-active{background:var(--pine);border-color:var(--pine);color:#fff;}
        .subtabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);}
        .subtabs button{background:none;border:none;padding:9px 4px;margin-right:20px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
        .subtabs button.active{color:var(--ink);border-color:var(--pine);}
        .task-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);}
        .task-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;}
        .task-table th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-soft);padding:10px 10px;border-bottom:1px solid var(--line);background:rgba(0,0,0,0.02);}
        .task-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
        .task-table tbody tr:last-child td{border-bottom:none;}
        .task-table input,.task-table select{width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);}
        .goal-pic-select{font-family:'Inter',sans-serif;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:170px;}
        .task-table input:focus,.task-table select:focus{outline:2px solid var(--pine);outline-offset:1px;}
        .task-no{text-align:center;color:var(--ink-soft);font-weight:600;}
        .task-empty{text-align:center;color:var(--ink-soft);padding:22px 10px !important;}
        .th-inner{display:flex;align-items:center;justify-content:space-between;gap:6px;}
        .th-actions{display:inline-flex;gap:2px;}
        .th-btn{background:none;border:none;padding:3px;border-radius:5px;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;opacity:.65;}
        .th-btn:hover{background:var(--track);opacity:1;}
