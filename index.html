        .th-pop{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(42,36,25,.16);padding:10px;width:224px;display:flex;flex-direction:column;gap:8px;font-weight:500;}
        .th-pop input,.th-pop select{width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);}
        .th-pop-col{display:flex;flex-direction:column;gap:8px;}
        .th-pop-col label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink-soft);}

        .th-pop-col label.th-check input{width:auto;}
        .th-reset{align-self:flex-end;background:none;border:none;color:var(--pine);font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px;}
        .task-table input.cell-err,.task-table select.cell-err{border-color:var(--rate-b);background:#FBEAE7;}

        .save-bar{
          display:flex;align-items:center;justify-content:space-between;gap:12px;
          margin-bottom:16px;
        }
        .save-status{font-size:12.5px;color:var(--sage-dark);font-weight:600;}
        .save-status.dirty{color:var(--clay);}

        /* list */
        .list{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:6px;}
        .list-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 12px;}

        .check{width:20px;height:20px;flex-shrink:0;border-radius:6px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
        .check.checked{background:var(--pine);border-color:var(--pine);}
        .list-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
        .list-title{font-size:13.5px;font-weight:500;}
        .list-title .qty{font-weight:400;color:var(--ink-soft);}
        .list-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
        .due{font-size:11.5px;color:var(--ink-soft);}
        .due.overdue{color:var(--clay);font-weight:700;}
        .icon-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px;flex-shrink:0;}
        .icon-btn:hover{color:var(--clay);}

        .tag{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
        .tag-rumah{background:var(--pine-tint);color:var(--pine);}
        .tag-belanja{background:var(--mustard-tint);color:#8A6316;}
        .tag-nanny{background:var(--sage-tint);color:var(--sage-dark);}
        .tag-kesehatan{background:var(--clay-tint);color:var(--clay);}
        .tag-pendidikan{background:var(--pine-tint);color:var(--pine);}
        .tag-lainnya{background:var(--track);color:var(--ink-soft);}
        .tag-payroll{background:var(--sage-tint);color:var(--sage-dark);}
        .tag-health{background:var(--clay-tint);color:var(--clay);}
        .tag-education{background:var(--pine-tint);color:var(--pine);}
        .tag-financial{background:var(--mustard-tint);color:#8A6316;}
                .fp-card{cursor:pointer;margin-bottom:18px;}
        .fp-card:hover{border-color:var(--pine);}
        .fp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
        .fp-head h2{margin-bottom:4px;}
        .fp-sub{margin:0;font-size:12.5px;color:var(--ink-soft);}
        .fp-link{font-size:12px;font-weight:600;color:var(--pine);white-space:nowrap;}

        .fp-donut{position:relative;width:220px;height:220px;}

        .fp-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
        .fp-pct{font-family:'Fraunces',serif;font-size:32px;font-weight:600;line-height:1;color:var(--ink);}
        .fp-pct-label{font-size:12px;color:var(--ink-soft);margin-top:4px;}
        .fp-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;}
        .fp-legend li{transition:opacity .15s;}
        .fp-legend li.dim{opacity:.4;}
        .fp-row-top{display:flex;align-items:center;gap:8px;}
        .fp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
        .fp-name{font-size:13.5px;font-weight:600;color:var(--ink);}
        .fp-prio{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--mustard-tint);color:#8A6316;}
        .fp-gpct{margin-left:auto;font-size:13px;font-weight:700;}
        .fp-bar{height:6px;border-radius:6px;background:var(--track);overflow:hidden;margin:6px 0 4px;}
        .fp-bar div{height:100%;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1);}
        .fp-row-sub{font-size:11.5px;color:var(--ink-soft);}
        .stat-lines{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--ink-soft);min-height:32px;}
        .tag-status-hadir{background:var(--sage-tint);color:var(--sage-dark);}

        .tag-status-sakit{background:var(--clay-tint);color:var(--clay);}
        .tag-status-libur{background:var(--track);color:var(--ink-soft);}

        .group-block{margin-bottom:18px;}
        .group-date{font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}

        .mini-stats{display:flex;gap:26px;margin-bottom:18px;flex-wrap:wrap;}
        .mini-stats > div{display:flex;flex-direction:column;gap:3px;}
        .mini-label{font-size:11px;color:var(--ink-soft);}
        .mini-val{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
        .mini-val.neg{color:var(--clay);}

        .budget-table{display:flex;flex-direction:column;gap:10px;}
        .budget-table-row{
          display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;
          gap:16px;align-items:center;
          background:var(--card);border:1px solid var(--line);border-radius:9px;padding:14px 16px;
        }
        .bt-name{display:flex;align-items:flex-start;gap:9px;}
        .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
        .bt-label{font-size:13.5px;font-weight:600;}
        .bt-note{font-size:11px;color:var(--ink-soft);margin-top:2px;}
        .rp-input{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;}
        .rp-input span{font-size:12px;color:var(--ink-soft);}
        .rp-input input{border:none;outline:none;font-size:13px;width:100%;font-family:'Inter',sans-serif;background:transparent;}
        .bt-spent strong{font-family:'Fraunces',serif;font-size:15px;}

        .field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);}

        /* nanny periods */

        .period-range{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--ink);}

        .item-chip input{accent-color:var(--pine);width:14px;height:14px;cursor:pointer;}
        .item-chip.checked{background:var(--pine-tint);border-color:var(--pine);color:var(--pine);font-weight:600;}

        .item-table{margin-top:14px;border:1px solid var(--line);border-radius:9px;overflow:hidden;}

          .fp-body{grid-template-columns:1fr;justify-items:center;}
          .fp-legend{width:100%;}
          .dash-lower{grid-template-columns:1fr;}
          .budget-table-row{grid-template-columns:1fr;}
        }
      `}</style>

      {loadError ? (
        <div className="app-loading">
          <AlertCircle size={22} />
          <p style={{ marginTop: 10, fontSize: 13, maxWidth: 320, textAlign: "center" }}>
            Tidak bisa terhubung ke database. Periksa koneksi internet, lalu coba lagi. (Database gratis Supabase bisa tertidur setelah lama tidak dipakai — butuh ±1 menit untuk aktif kembali.)
          </p>
          <button className="btn-primary" style={{ marginTop: 12 }} onClick={initialLoad}>Coba lagi</button>
        </div>
      ) : loading ? (
        <div className="app-loading">
          <Loader2 size={22} className="spin" />
          <p style={{ marginTop: 10, fontSize: 13 }}>Memuat data…</p>
        </div>
      ) : !authedUsername ? (
        <LoginPage users={data ? data.users : []} onLogin={handleLogin} />
      ) : (
        <>
      <aside className="sidebar">
        <div className="brand">
          Griya<span>Household Planner</span>
        </div>
        {visibleNavTop.map((n) => (
          <button
            key={n.key}
            className={"nav-item" + (tab === n.key ? " active" : "")}
            onClick={() => tab !== n.key && guardedNavigate(() => setTab(n.key))}
          >
            <n.icon size={16} strokeWidth={1.8} />
            {n.label}
          </button>
        ))}

        <button className="nav-group-header" onClick={() => setCategoryOpen((o) => !o)}>
          <span>{NAV_GROUP.label}</span>
          {categoryOpen ? <ChevronDown size={14} strokeWidth={2} /> : <ChevronRight size={14} strokeWidth={2} />}
        </button>
        {categoryOpen &&
          visibleNavGroup.map((n) => (
            <button
              key={n.key}
              className={"nav-item nav-item-child" + (tab === n.key ? " active" : "")}
              onClick={() => tab !== n.key && guardedNavigate(() => setTab(n.key))}
            >
              <n.icon size={16} strokeWidth={1.8} />
              {n.label}
            </button>
          ))}

        {visibleNavSettings.length > 0 && (
        <button className="nav-group-header" onClick={() => setSettingsOpen((o) => !o)}>
          <span>{NAV_SETTINGS_GROUP.label}</span>
          {settingsOpen ? <ChevronDown size={14} strokeWidth={2} /> : <ChevronRight size={14} strokeWidth={2} />}
        </button>
        )}
        {settingsOpen && visibleNavSettings.length > 0 &&
          visibleNavSettings.map((n) => (
            <button
              key={n.key}
              className={"nav-item nav-item-child" + (tab === n.key ? " active" : "")}
              onClick={() => tab !== n.key && guardedNavigate(() => setTab(n.key))}
            >
              <n.icon size={16} strokeWidth={1.8} />
              {n.label}
            </button>
          ))}

        <div className="sidebar-user">
          <span className="sidebar-user-name">{authedUsername}</span>
          <button className="nav-item" onClick={() => guardedNavigate(handleLogout)}>
            <LogOut size={16} strokeWidth={1.8} />
            Logout
          </button>
        </div>
      </aside>

      <main className="main">
        {loading || !data ? (
          <div style={{ padding: 60, textAlign: "center", color: "var(--ink-soft)" }}>
            <Loader2 size={22} className="spin" />
            <p style={{ marginTop: 10, fontSize: 13 }}>Memuat data…</p>
          </div>
        ) : (
          <>
            {tab === "dashboard" && canAccess("dashboard") && <Dashboard data={data} setTab={(t) => guardedNavigate(() => setTab(t))} openFinancialPlan={() => guardedNavigate(() => { setFinSubTab("plan"); setTab("budget"); })} />}
            {tab === "todo" && canAccess("todo") && <TodoTab data={data} update={update} appSave={appSave} />}
            {tab === "nanny" && canAccess("nanny") && <NannyTab data={data} update={update} appSave={appSave} />}
            {tab === "kesehatan" && canAccess("kesehatan") && <KesehatanTab data={data} update={update} appSave={appSave} />}
            {tab === "pendidikan" && canAccess("pendidikan") && (
              <PendidikanTab
                data={data}
                update={update}
                subTab={eduSubTab}
                setSubTab={(t) => (eduSubTab !== t ? guardedNavigate(() => setEduSubTab(t)) : null)}
                eduPlanDirty={eduPlanDirty}
                eduSaving={eduSaving}
                eduLastSavedAt={eduLastSavedAt}
                eduSaveError={eduSaveError}
                onSave={saveEducationPlan}
                appSave={appSave}
              />
            )}
            {tab === "budget" && canAccess("budget") && <BudgetTab data={data} update={update} appSave={appSave} subTab={finSubTab} setSubTab={setFinSubTab} />}
            {tab === "career" && canAccess("career") && <CareerTab data={data} update={update} appSave={appSave} />}
            {tab === "business" && canAccess("business") && <BusinessTab data={data} update={update} appSave={appSave} />}
            {tab === "masterdata" && canAccess("masterdata") && <MasterDataTab data={data} update={update} appSave={appSave} />}
            {tab === "usermanagement" && canAccess("usermanagement") && (
              <UserManagementTab data={data} update={update} appSave={appSave} currentUsername={authedUsername} />
            )}
          </>
        )}
      </main>

      {incompleteModal && (
        <div className="modal-overlay" onClick={() => { setIncompleteModal(null); setPendingAction(null); }}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <h2>Data Belum Lengkap</h2>
            <p className="modal-text">
              Ada baris di tabel To-Do yang masih memiliki kolom kosong (Task, PIC, atau Due Date). Lengkapi data terlebih dahulu
              {incompleteModal === "save" ? " sebelum menyimpan." : " sebelum pindah halaman."}
            </p>
            <div className="modal-actions">
              {incompleteModal === "nav" && (
                <button className="btn-secondary" onClick={handleContinueWithoutSaving}>
                  Continue without saving
                </button>
              )}
              <button className="btn-primary" onClick={() => { setIncompleteModal(null); setPendingAction(null); }}>
                Edit Changes
              </button>
            </div>
          </div>
        </div>
      )}

      {showLeaveModal && (
        <div className="modal-overlay" onClick={() => setShowLeaveModal(false)}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <h2>Perubahan Belum Disimpan</h2>
            <p className="modal-text">
              Ada perubahan yang belum disimpan. Apa yang ingin kamu lakukan?
            </p>
            <div className="modal-actions">
              <button className="btn-secondary" onClick={handleContinueWithoutSaving}>
                Continue without saving
              </button>
              <button className="btn-primary" onClick={handleSaveAndContinue} disabled={eduSaving}>
                {eduSaving ? <Loader2 size={16} className="spin" /> : <Check size={16} />} Save changes
              </button>
            </div>
          </div>
        </div>
      )}
        </>
      )}

      <style>{`.spin{animation:spin 1s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}`}</style>
    </div>
    </TaskValidationContext.Provider>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  (function () {
    var code = document.getElementById("app-source").textContent;
    var output = Babel.transform(code, {
      presets: [["react", { runtime: "classic" }]],
      filename: "app.jsx",
    }).code;
    var s = document.createElement("script");
    s.textContent = output;
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
